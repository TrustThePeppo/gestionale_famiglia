<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Famiglia Completo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerie per esportazioni (Word + PDF) -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .toast-enter { animation: toastIn 0.3s ease-out forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen overflow-hidden flex font-sans text-slate-800">

    <!-- SCHERMATA DI LOGIN (BLOCCO ACCESSO) -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Accesso Riservato</h2>
                <p class="text-slate-500 text-sm mt-2">Inserisci le tue credenziali per accedere. Al primo accesso, la password che scriverai diventerà quella definitiva.</p>
            </div>
            
            <form onsubmit="eseguiLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nome Utente</label>
                    <input type="text" id="login-user" required class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-medium" placeholder="es. mario.rossi">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" id="login-pass" required class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-medium" placeholder="••••••••">
                </div>
                <div id="login-msg" class="text-sm font-medium text-center hidden"></div>
                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold shadow-md transition-all flex justify-center items-center gap-2">
                    <span>Accedi al Gestionale</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- NOTIFICA TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-xl pointer-events-none z-50 flex items-center gap-3 font-medium text-sm hidden">
        <i id="toast-icon" data-lucide="info" class="w-5 h-5"></i>
        <span id="toast-msg">Notifica</span>
    </div>

    <!-- SIDEBAR NAVIGAZIONE -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col h-full flex-shrink-0 z-20">
        <div class="p-6 border-b border-slate-700/50">
            <h1 class="text-white font-bold text-lg tracking-wide">Gestionale Famiglia</h1>
            <p class="text-xs text-slate-400 mt-1" id="status-cloud">Connessione in corso...</p>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-6">
            <!-- DASHBOARD -->
            <div class="px-3">
                <button onclick="cambiaVista('dashboard', 'Generale')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors text-left menu-btn" data-target="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-blue-400"></i>
                    <span class="font-medium text-sm">Quadro Generale</span>
                </button>
            </div>

            <!-- SEZIONE CASA -->
            <div class="px-3">
                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i> Casa
                </h3>
                <ul class="space-y-1">
                    <li><button onclick="cambiaVista('casa', 'Rate Condominio')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Rate Condominio</button></li>
                    <li><button onclick="cambiaVista('casa', 'Verbali Riunioni')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Verbali Riunioni</button></li>
                    <li><button onclick="cambiaVista('casa', 'Rendiconti')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Rendiconti (Prev/Cons)</button></li>
                    <li><button onclick="cambiaVista('casa', 'Caldaia')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Caldaia</button></li>
                    <li><button onclick="cambiaVista('casa', 'TARI')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>TARI</button></li>
                </ul>
            </div>

            <!-- SEZIONE VEICOLI -->
            <div class="px-3">
                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-lucide="car" class="w-4 h-4"></i> Veicoli
                </h3>
                <ul class="space-y-1">
                    <li><button onclick="cambiaVista('veicoli', 'I Miei Mezzi')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>I Miei Mezzi</button></li>
                    <li><button onclick="cambiaVista('veicoli', 'Manutenzioni')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Manutenzioni e Scadenze</button></li>
                </ul>
            </div>

            <!-- SEZIONE PRESTITI -->
            <div class="px-3">
                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-lucide="piggy-bank" class="w-4 h-4"></i> Finanze
                </h3>
                <ul class="space-y-1">
                    <li><button onclick="cambiaVista('prestiti', 'Mutui e Prestiti')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Mutui e Prestiti</button></li>
                </ul>
            </div>

            <!-- SEZIONE SCADENZARIO -->
            <div class="px-3 mt-4">
                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-lucide="calendar-days" class="w-4 h-4"></i> Scadenzario
                </h3>
                <ul class="space-y-1">
                    <li><button onclick="cambiaVista('scadenzario', 'Ricerca Scadenze')" class="w-full flex items-center px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white text-sm text-left transition-colors menu-btn"><span class="w-1.5 h-1.5 rounded-full bg-slate-600 mr-3"></span>Ricerca Scadenze</button></li>
                </ul>
            </div>

            <!-- LOGOUT -->
            <div class="px-3 pt-6 mt-6 border-t border-slate-700/50">
                <button onclick="esciDalGestionale()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-red-900/50 hover:text-red-400 text-slate-400 text-sm text-left transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="font-medium">Esci / Blocca</span>
                </button>
            </div>
        </nav>
    </aside>

    <!-- AREA PRINCIPALE -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
        
        <!-- HEADER TOP -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10">
            <h2 id="titolo-sezione" class="text-xl font-bold text-slate-800">Quadro Generale</h2>
            <div id="header-actions">
                <!-- Bottoni dinamici (es. aggiungi) caricati via JS -->
            </div>
        </header>

        <!-- CONTENITORE DINAMICO -->
        <div id="main-content" class="flex-1 overflow-y-auto p-8">
            <div class="flex items-center justify-center h-full text-slate-400">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
            </div>
        </div>

    </main>

    <!-- MODALE GENERICA -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 relative">
            <button onclick="chiudiModale()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 bg-slate-100 p-1.5 rounded-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modal-content">
                <!-- Contenuto iniettato dinamicamente -->
            </div>
        </div>
    </div>


    <!-- ================= LOGICA APPLICAZIONE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Inizializza Icone Iniziali
        lucide.createIcons();

        // 1. CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCQgihxQH8NamZRSKHxvyxR9LJGI82wHMQ",
            authDomain: "gestionale-family.firebaseapp.com",
            projectId: "gestionale-family",
            storageBucket: "gestionale-family.firebasestorage.app",
            messagingSenderId: "901807828741",
            appId: "1:901807828741:web:283634f54764fa8f9c516c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Identificativo App Fisso
        const APP_ID = 'gestionale_famiglia_pro';
        let currentUserId = 'famiglia_default'; // Fallback per sicurezza

        // Stato Globale Dati
        window.appState = {
            vistaAttuale: 'dashboard',
            sottoCategoria: 'Generale',
            dati: {
                scadenze_casa: [], // Usa per TARI, Condominio, Caldaia, Verbali, Rendiconti
                veicoli: [],
                prestiti: []
            }
        };

        // Riferimenti DB (popolati dopo autenticazione)
        let refs = {};

        // --- SISTEMA DI NOTIFICHE ---
        window.mostraNotifica = function(messaggio, tipo = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = messaggio;
            
            toast.className = "fixed bottom-6 right-6 px-6 py-3 rounded-lg shadow-xl flex items-center gap-3 font-medium text-sm z-50 toast-enter";
            
            if(tipo === 'success') {
                toast.classList.add('bg-emerald-600', 'text-white');
                icon.setAttribute('data-lucide', 'check-circle');
            } else if(tipo === 'error') {
                toast.classList.add('bg-red-600', 'text-white');
                icon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                toast.classList.add('bg-blue-600', 'text-white');
                icon.setAttribute('data-lucide', 'info');
            }
            lucide.createIcons({root: toast});
            
            setTimeout(() => { 
                toast.classList.add('hidden'); 
                toast.classList.remove('toast-enter');
            }, 3000);
        }

        // --- SISTEMA DI LOGIN E AUTENTICAZIONE ---
        const UTENTI_AUTORIZZATI = ['giuseppe.mastroiacovo', 'valentina.gaudieri'];
        
        window.eseguiLogin = async (e) => {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('login-btn');
            const msg = document.getElementById('login-msg');
            
            const mostraErrore = (testo, colore = 'text-red-500') => {
                msg.className = `text-sm font-bold text-center block ${colore}`;
                msg.innerText = testo;
            };

            if (!UTENTI_AUTORIZZATI.includes(user)) {
                mostraErrore('Nome utente non riconosciuto.');
                return;
            }

            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Verifica in corso...';
            lucide.createIcons();
            
            try {
                // Legge o crea il documento con le password
                const authRef = doc(db, 'artifacts', APP_ID, 'settings', 'auth_passwords');
                const authSnap = await getDoc(authRef);
                
                let databasePasswords = {};
                if (authSnap.exists()) {
                    databasePasswords = authSnap.data();
                }

                if (!databasePasswords[user]) {
                    // È il primissimo accesso, salvo la password
                    databasePasswords[user] = pass;
                    await setDoc(authRef, databasePasswords, { merge: true });
                    mostraErrore('Prima registrazione password effettuata! Accesso...', 'text-emerald-500');
                    completaLogin(user);
                } else {
                    // L'utente aveva già una password, verifico
                    if (databasePasswords[user] === pass) {
                        completaLogin(user);
                    } else {
                        mostraErrore('Password errata. Riprova.');
                        btn.innerHTML = '<span>Accedi al Gestionale</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                        lucide.createIcons();
                    }
                }
            } catch (error) {
                mostraErrore('Errore di connessione al Cloud.');
                console.error(error);
                btn.innerHTML = '<span>Accedi al Gestionale</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        };

        function completaLogin(user) {
            sessionStorage.setItem('gestionale_utente_attivo', user);
            document.getElementById('login-screen').classList.replace('flex', 'hidden');
            mostraNotifica(`Benvenuto/a ${user}!`, 'success');
            caricaDatiDatabase();
        }

        window.esciDalGestionale = () => {
            sessionStorage.removeItem('gestionale_utente_attivo');
            location.reload(); // Ricarica la pagina riportando alla schermata di login
        }


        // --- INIZIALIZZAZIONE SICURA ---
        async function avviaApp() {
            try {
                // Tenta accesso anonimo per sicurezza dati di Firebase
                await signInAnonymously(auth);
            } catch (error) {
                console.warn("Accesso anonimo fallito/disabilitato.", error);
            }

            // Verifica se l'utente ha già fatto login in questa sessione
            const utenteAttivo = sessionStorage.getItem('gestionale_utente_attivo');
            if (utenteAttivo && UTENTI_AUTORIZZATI.includes(utenteAttivo)) {
                // Salta il login e carica i dati
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('flex');
                caricaDatiDatabase();
            } else {
                // Mostra la schermata di login
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('login-screen').classList.add('flex');
            }
        }

        function caricaDatiDatabase() {
            document.getElementById('status-cloud').innerHTML = `<span class="text-emerald-400">● Cloud Sicuro Attivo</span>`;

            // Imposta percorsi corretti (Regola 1)
            refs.casa = collection(db, 'artifacts', APP_ID, 'users', currentUserId, 'scadenze_casa');
            refs.veicoli = collection(db, 'artifacts', APP_ID, 'users', currentUserId, 'veicoli');
            refs.prestiti = collection(db, 'artifacts', APP_ID, 'users', currentUserId, 'prestiti');

            // Avvia Ascoltatori DB
            onSnapshot(refs.casa, (snap) => {
                window.appState.dati.scadenze_casa = [];
                snap.forEach(doc => window.appState.dati.scadenze_casa.push({ id: doc.id, ...doc.data() }));
                renderizzaContenuto();
            }, (err) => console.error("Errore DB Casa", err));

            onSnapshot(refs.veicoli, (snap) => {
                window.appState.dati.veicoli = [];
                snap.forEach(doc => window.appState.dati.veicoli.push({ id: doc.id, ...doc.data() }));
                renderizzaContenuto();
            }, (err) => console.error("Errore DB Veicoli", err));

            onSnapshot(refs.prestiti, (snap) => {
                window.appState.dati.prestiti = [];
                snap.forEach(doc => window.appState.dati.prestiti.push({ id: doc.id, ...doc.data() }));
                renderizzaContenuto();
            }, (err) => console.error("Errore DB Prestiti", err));

            // Avvio UI
            cambiaVista('dashboard', 'Quadro Generale');
        }

        // --- SISTEMA DI NAVIGAZIONE ---
        window.cambiaVista = function(vista, titolo) {
            window.appState.vistaAttuale = vista;
            window.appState.sottoCategoria = titolo;
            
            document.getElementById('titolo-sezione').innerText = titolo;
            
            // Aggiorna stili menu
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('text-slate-400');
            });
            event?.currentTarget?.classList?.add('bg-blue-600', 'text-white');
            event?.currentTarget?.classList?.remove('text-slate-400');

            renderizzaContenuto();
        }

        // --- RENDERIZZAZIONE MOTORE PRINCIPALE ---
        function renderizzaContenuto() {
            const container = document.getElementById('main-content');
            const actions = document.getElementById('header-actions');
            actions.innerHTML = ''; // Reset bottoni

            if (window.appState.vistaAttuale === 'dashboard') {
                container.innerHTML = creaHtmlDashboard();
            } 
            else if (window.appState.vistaAttuale === 'scadenzario') {
                actions.innerHTML = ``;
                container.innerHTML = creaHtmlScadenzario();
            }
            else if (window.appState.vistaAttuale === 'casa') {
                actions.innerHTML = `<button onclick="apriModaleCasa()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Aggiungi Voce</button>`;
                container.innerHTML = creaHtmlCasa(window.appState.sottoCategoria);
            }
            else if (window.appState.vistaAttuale === 'veicoli') {
                if (window.appState.sottoCategoria === 'I Miei Mezzi') {
                    actions.innerHTML = `<button onclick="apriModaleVeicolo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i data-lucide="car-front" class="w-4 h-4"></i> Registra Veicolo</button>`;
                    container.innerHTML = creaHtmlVeicoli_Anagrafica();
                } else {
                    actions.innerHTML = ``; // I pulsanti di aggiunta saranno sulle singole schede veicolo
                    container.innerHTML = creaHtmlVeicoli_Manutenzioni();
                }
            }
            else if (window.appState.vistaAttuale === 'prestiti') {
                actions.innerHTML = `<button onclick="apriModalePrestito()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2"><i data-lucide="piggy-bank" class="w-4 h-4"></i> Nuovo Finanziamento</button>`;
                container.innerHTML = creaHtmlPrestiti();
            }

            lucide.createIcons();
        }

        // ==========================================
        // VISTA: DASHBOARD
        // ==========================================
        function creaHtmlDashboard() {
            const totVeicoli = window.appState.dati.veicoli.length;
            const totPrestiti = window.appState.dati.prestiti.length;
            const totCasa = window.appState.dati.scadenze_casa.length;

            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"><i data-lucide="home"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Registrazioni Casa</p><p class="text-2xl font-bold text-slate-800">${totCasa}</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600"><i data-lucide="car"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Veicoli nel box</p><p class="text-2xl font-bold text-slate-800">${totVeicoli}</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600"><i data-lucide="credit-card"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Mutui/Prestiti attivi</p><p class="text-2xl font-bold text-slate-800">${totPrestiti}</p></div>
                    </div>
                </div>
                
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-6 text-center">
                    <i data-lucide="smile" class="w-10 h-10 text-blue-400 mx-auto mb-3"></i>
                    <h3 class="text-lg font-bold text-blue-900">Benvenuto nel tuo nuovo Gestionale</h3>

            const formattaData = (dataStr) => {

                        </td>
                    </tr>
                `;

                return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">

                            </div>

                        <button onclick="apriModaleManutenzione('${v.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-colors shadow-sm">
                            <i data-lucide="plus" class="w-3 h-3"></i> Aggiungi Voce

                    </div>
                    
                    <!-- SEZIONE SCADENZE -->
                    <div class="p-4 bg-orange-50/30 border-b border-slate-100">
                        <h4 class="text-sm font-bold text-orange-800 mb-2 flex items-center gap-1"><i data-lucide="calendar-clock" class="w-4 h-4"></i> Scadenze e Prossimi Appuntamenti</h4>
                        <div class="overflow-x-auto rounded border border-orange-100/50 bg-white">
                            <table class="w-full text-left text-sm min-w-max">

                                        <th class="py-2 px-4 font-semibold">Tipo Scadenza</th>
                                        <th class="py-2 px-4 font-semibold">Data Scadenza</th>

                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${scadenze.length > 0 ? scadenze.map(m => renderRow(m, true)).join('') : '<tr><td colspan="5" class="py-4 text-center text-slate-400 text-xs italic">Nessuna scadenza imminente.</td></tr>'}

        // ==========================================

        // ==========================================
        function creaHtmlScadenzario() {
            return `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Trova ed Esporta le tue Scadenze</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Filtro per Data -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Da questa data in poi:</label>
                        <div class="flex gap-2">
                            <input type="date" id="filtro-data" class="flex-1 border border-slate-300 rounded p-2 text-sm outline-none focus:border-blue-500">
                            <button onclick="cercaScadenze('data')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition-colors">Mostra Elenco</button>
                        </div>
                    </div>
                    <!-- Filtro per Anno -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nell'anno solare completo:</label>
                        <div class="flex gap-2">
                            <input type="number" id="filtro-anno" min="2000" max="2100" placeholder="Es. 2026" class="flex-1 border border-slate-300 rounded p-2 text-sm outline-none focus:border-blue-500">
                            <button onclick="cercaScadenze('anno')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition-colors">Mostra Elenco</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="risultati-scadenzario">
                <!-- La tabella con i risultati verrà iniettata qui dal motore di ricerca -->
            </div>
            `;
        }

        window.cercaScadenze = function(tipoFiltro) {
            let scadenzeTrovate = [];
            
            // 1. Aggiungi tutte le scadenze dalla sezione "Casa"
            window.appState.dati.scadenze_casa.forEach(s => {
                if (s.data) {
                    scadenzeTrovate.push({
                        origine: `Casa - ${s.sottoCategoria}`,
                        descrizione: s.titolo,
                        data: s.data,
                        importo: s.importo
                    });
                }
            });

            // 2. Aggiungi le scadenze specifiche dai "Veicoli" (Bollo, Assicurazione, Revisione, Tagliando)
            const tipiScadenze = ['Scadenza Bollo', 'Scadenza Assicurazione', 'Scadenza Revisione'];
            window.appState.dati.veicoli.forEach(v => {
                if(v.manutenzioni) {
                    v.manutenzioni.forEach(m => {
                        if(tipiScadenze.includes(m.tipoIntervento) && m.data) {
                            scadenzeTrovate.push({
                                origine: `Veicolo - ${v.marcaModello} (${v.targa})`,
                                descrizione: m.tipoIntervento,
                                data: m.data,
                                importo: m.importo
                            });
                        }
                    });

                    // Calcola e aggiungi "Prossimo Tagliando Stimato" se applicabile
                    const interventi = v.manutenzioni.filter(m => !tipiScadenze.includes(m.tipoIntervento));
                    const tagliandi = interventi.filter(m => m.tipoIntervento === 'Tagliando').sort((a,b) => new Date(b.data) - new Date(a.data));
                    if (tagliandi.length > 0 && tagliandi[0].data) {
                        const d = new Date(tagliandi[0].data);
                        d.setFullYear(d.getFullYear() + 1); // un anno in avanti
                        scadenzeTrovate.push({
                            origine: `Veicolo - ${v.marcaModello} (${v.targa})`,
                            descrizione: 'Prossimo Tagliando (Stimato)',
                            data: d.toISOString().split('T')[0],
                            importo: ''
                        });
                    }
                }
            });

            // Filtro e Ordinamento
            let risultati = [];
            if(tipoFiltro === 'data') {
                const dataSelezionata = document.getElementById('filtro-data').value;
                if(!dataSelezionata) return mostraNotifica("Inserisci una data nel primo campo", "error");
                
                const dataTarget = new Date(dataSelezionata).setHours(0,0,0,0);
                risultati = scadenzeTrovate.filter(s => new Date(s.data).setHours(0,0,0,0) >= dataTarget);
            } else {
                const annoSelezionato = document.getElementById('filtro-anno').value;
                if(!annoSelezionato) return mostraNotifica("Inserisci l'anno solare nel secondo campo", "error");
                
                risultati = scadenzeTrovate.filter(s => s.data.substring(0,4) === annoSelezionato.toString());
            }

            // Ordina sempre dalla data più vicina a quella più lontana
            risultati.sort((a,b) => new Date(a.data) - new Date(b.data));

            // Salva nel window per consentire l'esportazione successiva (pdf/word)
            window.scadenzeTrovateExport = risultati;
            renderizzaRisultatiScadenzario(risultati, tipoFiltro);
        }

        function renderizzaRisultatiScadenzario(risultati, tipoFiltro) {
            const container = document.getElementById('risultati-scadenzario');
            if(risultati.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500 font-medium"><i data-lucide="check-circle" class="w-10 h-10 mx-auto text-emerald-500 mb-3"></i>Nessuna scadenza trovata per il periodo selezionato.</div>`;
                lucide.createIcons({root: container});
                return;
            }

            const formattaData = (dataStr) => {
                if (!dataStr) return '-';
                const p = dataStr.split('-');
                return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dataStr;
            };

            const theHtml = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center flex-wrap gap-4">
                        <h4 class="font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="list-checks" class="text-blue-600"></i>
                            Elenco Trovato (${risultati.length} occorrenze)
                        </h4>
                        <div class="flex gap-2">
                            <button onclick="esportaScadenzarioWord()" class="bg-white border border-blue-200 hover:bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm"><i data-lucide="file-text" class="w-4 h-4"></i> Esporta in Word</button>
                            <button onclick="esportaScadenzarioPDF()" class="bg-white border border-red-200 hover:bg-red-50 text-red-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm"><i data-lucide="file-check-2" class="w-4 h-4"></i> Tabella PDF</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm min-w-max">
                            <thead class="bg-white text-slate-500 border-b border-slate-200 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="py-3 px-4">Data Scadenza</th>
                                    <th class="py-3 px-4">Categoria / Riferimento</th>
                                    <th class="py-3 px-4">Descrizione</th>
                                    <th class="py-3 px-4 text-right">Importo</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${risultati.map(r => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="py-3 px-4 font-bold text-orange-600">${formattaData(r.data)}</td>
                                        <td class="py-3 px-4 text-slate-600 text-xs font-mono">${r.origine}</td>
                                        <td class="py-3 px-4 font-medium text-slate-800">${r.descrizione}</td>
                                        <td class="py-3 px-4 text-right text-slate-700 font-medium">${r.importo ? '€ '+parseFloat(r.importo).toFixed(2) : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = theHtml;
            lucide.createIcons({root: container});
        }

        window.esportaScadenzarioWord = () => {
            if(!window.scadenzeTrovateExport || window.scadenzeTrovateExport.length === 0) return;
            mostraNotifica("Generazione documento Word in corso...", "info");
            
            const formattaData = (dataStr) => {
                const p = dataStr.split('-');
                return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dataStr;
            };

            const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
            const paragrafi = [
                new Paragraph({ text: "Scadenzario - Gestionale Famiglia", heading: HeadingLevel.HEADING_1 }),
                new Paragraph({ text: "Generato il: " + new Date().toLocaleDateString('it-IT') }),
                new Paragraph({ text: "" }) 
            ];

            window.scadenzeTrovateExport.forEach(scad => {
                paragrafi.push(
                    new Paragraph({
                        children: [
                            new TextRun({ text: `${formattaData(scad.data)} - `, bold: true }),
                            new TextRun({ text: `${scad.descrizione}`, bold: true }),
                            new TextRun({ text: ` [${scad.origine}]`, italics: true }),
                            new TextRun({ text: scad.importo ? ` (Importo: € ${scad.importo})` : '' }),
                        ],
                    })
                );
            });

            const docExport = new Document({ sections: [{ properties: {}, children: paragrafi }] });

            Packer.toBlob(docExport).then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "Elenco_Scadenze.docx";
                a.click();
                mostraNotifica("Documento Word scaricato con successo!", "success");
            });
        }

        window.esportaScadenzarioPDF = () => {
            if(!window.scadenzeTrovateExport || window.scadenzeTrovateExport.length === 0) return;
            mostraNotifica("Generazione documento PDF in corso...", "info");
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const formattaData = (dataStr) => {
                const p = dataStr.split('-');
                return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dataStr;
            };

            doc.setFontSize(16);
            doc.text("Tabella Scadenze - Gestionale Famiglia", 14, 20);
            doc.setFontSize(10);
            doc.text("Generato il: " + new Date().toLocaleDateString('it-IT'), 14, 26);

            const tableColumn = ["Data", "Riferimento", "Descrizione", "Importo"];
            const tableRows = [];

            window.scadenzeTrovateExport.forEach(scad => {
                tableRows.push([
                    formattaData(scad.data),
                    scad.origine,
                    scad.descrizione,
                    scad.importo ? 'Eur ' + scad.importo : '-'
                ]);
            });

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 32,
                theme: 'striped',
                headStyles: { fillColor: [31, 41, 55] }, // Colore slate-800
                styles: { fontSize: 9 }
            });

            doc.save("Tabella_Scadenze.pdf");
            mostraNotifica("Documento PDF scaricato con successo!", "success");
        }

        // ==========================================
        // GESTIONE MODALI E SALVATAGGIO
        // ==========================================
        const modalCont = document.getElementById('modal-container');
        const modalInner = document.getElementById('modal-content');

        window.chiudiModale = () => { modalCont.classList.replace('flex', 'hidden'); }
        function apriModaleHTML(titolo, htmlBody) {
            modalInner.innerHTML = `<h2 class="text-xl font-bold mb-4 text-slate-800">${titolo}</h2>${htmlBody}`;
            modalCont.classList.replace('hidden', 'flex');
            lucide.createIcons({root: modalInner});
        }

        // Modale Aggiungi Casa
        window.apriModaleCasa = () => {
            const cat = window.appState.sottoCategoria;
            apriModaleHTML(`Nuovo: ${cat}`, `
                <form onsubmit="salvaCasa(event)" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Descrizione</label><input type="text" id="m-titolo" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-blue-500"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Data / Scadenza</label><input type="date" id="m-data" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-blue-500"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Importo (€) Opzionale</label><input type="number" step="0.01" id="m-importo" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-blue-500"></div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 mt-2">Salva</button>
                </form>
            `);
        }
        window.salvaCasa = async (e) => {
            e.preventDefault();
            const data = {
                sottoCategoria: window.appState.sottoCategoria,
                titolo: document.getElementById('m-titolo').value,
                data: document.getElementById('m-data').value,
                importo: document.getElementById('m-importo').value,
                ts: Date.now()
            };
            await addDoc(refs.casa, data);
            chiudiModale(); mostraNotifica("Salvato con successo", "success");
        }

        // Modale Aggiungi Veicolo
        window.apriModaleVeicolo = () => {
            apriModaleHTML(`Registra Nuovo Veicolo`, `
                <form onsubmit="salvaVeicolo(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Tipo Veicolo</label><select id="v-tipo" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"><option value="Auto">Auto</option><option value="Moto">Moto</option><option value="Altro">Altro</option></select></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Marca e Modello</label><input type="text" id="v-marca" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500" placeholder="es. Fiat Panda"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Targa</label><input type="text" id="v-targa" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500 uppercase"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Data Immatricolazione</label><input type="date" id="v-anno" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Numero Telaio</label><input type="text" id="v-telaio" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500 uppercase"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Data Inizio Possesso</label><input type="date" id="v-possesso" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"></div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 mt-2">Salva Veicolo</button>
                </form>
            `);
        }
        window.salvaVeicolo = async (e) => {
            e.preventDefault();
            await addDoc(refs.veicoli, {
                tipo: document.getElementById('v-tipo').value,
                marcaModello: document.getElementById('v-marca').value,
                targa: document.getElementById('v-targa').value.toUpperCase(),
                anno: document.getElementById('v-anno').value,
                telaio: document.getElementById('v-telaio').value.toUpperCase(),
                dataPossesso: document.getElementById('v-possesso').value,
                manutenzioni: [],
                ts: Date.now()
            });
            chiudiModale(); mostraNotifica("Veicolo aggiunto!", "success");
        }

        // Modale Aggiungi/Modifica Manutenzione Veicolo
        window.apriModaleManutenzione = (veicoloId, idMan = null) => {
            const veicolo = window.appState.dati.veicoli.find(v => v.id === veicoloId);
            let m = { tipoIntervento: 'Tagliando', data: '', dataProssima: '', km: '', importo: '', lavori: '' };
            if (idMan && veicolo.manutenzioni) {
                m = veicolo.manutenzioni.find(x => x.idMan === idMan) || m;
            }

            apriModaleHTML(`${idMan ? 'Modifica' : 'Nuova'} Manutenzione o Scadenza`, `
                <form onsubmit="salvaManutenzione(event, '${veicoloId}', '${idMan || ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Tipo di Registrazione</label>
                        <select id="man-tipo" onchange="aggiornaCampiManutenzione()" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500">
                            <option value="Tagliando" ${m.tipoIntervento === 'Tagliando' ? 'selected' : ''}>Tagliando (con lavori e importo)</option>
                            <option value="Scadenza Bollo" ${m.tipoIntervento === 'Scadenza Bollo' ? 'selected' : ''}>Scadenza Bollo</option>
                            <option value="Scadenza Assicurazione" ${m.tipoIntervento === 'Scadenza Assicurazione' ? 'selected' : ''}>Scadenza Assicurazione</option>
                            <option value="Scadenza Revisione" ${m.tipoIntervento === 'Scadenza Revisione' ? 'selected' : ''}>Scadenza Revisione</option>
                            <option value="Sostituzione Pneumatici" ${m.tipoIntervento === 'Sostituzione Pneumatici' ? 'selected' : ''}>Sostituzione Pneumatici</option>
                            <option value="Inversione Pneumatici" ${m.tipoIntervento === 'Inversione Pneumatici' ? 'selected' : ''}>Inversione Pneumatici</option>
                            <option value="Altro" ${m.tipoIntervento === 'Altro' ? 'selected' : ''}>Altro Intervento / Scadenza</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div id="container-man-data1"><label id="label-man-data1" class="block text-xs font-semibold text-slate-500 mb-1">Data</label><input type="date" id="man-data" value="${m.data}" required class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"></div>
                        <div id="container-man-data2" class="hidden"><label id="label-man-data2" class="block text-xs font-semibold text-slate-500 mb-1">Data Prossima</label><input type="date" id="man-data-prossima" value="${m.dataProssima || ''}" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"></div>
                    </div>
                    <div id="container-man-km" class="hidden">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Chilometraggio (Km)</label>
                        <input type="number" id="man-km" value="${m.km || ''}" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500" placeholder="es. 50000">
                    </div>
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Importo (€) Opzionale</label><input type="number" step="0.01" id="man-importo" value="${m.importo}" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500"></div>
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Lavori / Dettagli aggiuntivi (Opzionale)</label><textarea id="man-lavori" rows="2" class="w-full border rounded-lg p-2 text-sm outline-none focus:border-indigo-500" placeholder="Es. Cambio olio, filtro abitacolo...">${m.lavori}</textarea></div>
                    <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-lg font-medium mt-2">${idMan ? 'Salva Modifiche' : 'Registra Voce'}</button>
                </form>
            `);

            // Aggiorna visibilità ed etichette dei campi al momento dell'apertura
            setTimeout(() => window.aggiornaCampiManutenzione(), 10);
        }

        // Funzione per mostrare/nascondere e rinominare i campi data
        window.aggiornaCampiManutenzione = () => {
            const tipo = document.getElementById('man-tipo')?.value;
            if(!tipo) return;
            const containerData2 = document.getElementById('container-man-data2');
            const labelData1 = document.getElementById('label-man-data1');
            const labelData2 = document.getElementById('label-man-data2');
            const containerKm = document.getElementById('container-man-km');

            // Nascondi sempre il secondo campo di default (e allarga il primo a tutta larghezza se serve)
            containerData2.classList.add('hidden');
            document.getElementById('container-man-data1').parentElement.classList.remove('grid-cols-2');
            document.getElementById('container-man-data1').parentElement.classList.add('grid-cols-1');

            // Logica Chilometraggio
            const tipiConKm = ['Tagliando', 'Sostituzione Pneumatici', 'Inversione Pneumatici', 'Altro'];
            if (tipiConKm.includes(tipo)) {
                containerKm.classList.remove('hidden');
            } else {
                containerKm.classList.add('hidden');
                document.getElementById('man-km').value = ''; // Pulisce il campo se nascosto
            }

            if (tipo === 'Tagliando') {
                labelData1.innerText = 'Data Esecuzione';
            } else if (tipo.startsWith('Scadenza')) {
                labelData1.innerText = 'Data Scadenza';
            } else if (tipo === 'Sostituzione Pneumatici') {
                labelData1.innerText = 'Data Sostituzione';
            } else if (tipo === 'Inversione Pneumatici') {
                labelData1.innerText = 'Data Inversione';
                labelData2.innerText = 'Prossima Inversione';
                // Mostra il secondo campo e ripristina le 2 colonne
                containerData2.classList.remove('hidden');
                document.getElementById('container-man-data1').parentElement.classList.remove('grid-cols-1');
                document.getElementById('container-man-data1').parentElement.classList.add('grid-cols-2');
            } else {
                labelData1.innerText = 'Data Intervento';
            }
        };
        
        window.salvaManutenzione = async (e, id, idManStr) => {
            e.preventDefault();
            const veicolo = window.appState.dati.veicoli.find(v => v.id === id);
            let nuoveManutenzioni = [...(veicolo.manutenzioni || [])];
            
            const newData = {
                idMan: idManStr ? idManStr : ('man_' + Date.now() + Math.floor(Math.random()*1000)),
                tipoIntervento: document.getElementById('man-tipo').value, 
                data: document.getElementById('man-data').value,
                dataProssima: document.getElementById('man-data-prossima').value,
                km: document.getElementById('man-km').value,
                importo: document.getElementById('man-importo').value,
                lavori: document.getElementById('man-lavori').value
            };

            if (idManStr) {
                // Aggiornamento
                const index = nuoveManutenzioni.findIndex(x => x.idMan === idManStr);
                if (index > -1) nuoveManutenzioni[index] = newData;
            } else {
                // Nuovo inserimento
                nuoveManutenzioni.push(newData);
            }
            
            // Ordina le manutenzioni per data decrescente
            nuoveManutenzioni.sort((a, b) => new Date(b.data) - new Date(a.data));
            
            await updateDoc(doc(db, 'artifacts', APP_ID, 'users', currentUserId, 'veicoli', id), { manutenzioni: nuoveManutenzioni });
            chiudiModale(); mostraNotifica(idManStr ? "Modifica salvata con successo" : "Voce registrata con successo", "success");
        }

        window.eliminaManutenzione = async (veicoloId, idMan) => {
            if(!confirm("Sicuro di voler eliminare questa voce dal libretto?")) return;
            const veicolo = window.appState.dati.veicoli.find(v => v.id === veicoloId);
            const nuoveManutenzioni = veicolo.manutenzioni.filter(m => m.idMan !== idMan);
            
            await updateDoc(doc(db, 'artifacts', APP_ID, 'users', currentUserId, 'veicoli', veicoloId), { manutenzioni: nuoveManutenzioni });
            mostraNotifica("Voce eliminata", "success");
        }

        // Modale Aggiungi Prestito
        window.apriModalePrestito = () => {
            apriModaleHTML(`Nuovo Finanziamento`, `
                <form onsubmit="salvaPrestito(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Nome</label><input type="text" id="p-nome" required class="w-full border rounded-lg p-2 text-sm outline-none" placeholder="es. Mutuo Prima Casa"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Tipo</label><select id="p-tipo" class="w-full border rounded-lg p-2 text-sm outline-none"><option value="Mutuo">Mutuo</option><option value="Prestito">Prestito</option></select></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Importo Rata Mensile (€)</label><input type="number" step="0.01" id="p-rata" required class="w-full border rounded-lg p-2 text-sm outline-none"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Numero Totale Rate</label><input type="number" id="p-num" required class="w-full border rounded-lg p-2 text-sm outline-none"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Tasso %</label><input type="number" step="0.01" id="p-tasso" required class="w-full border rounded-lg p-2 text-sm outline-none" placeholder="es. 3.5"></div>
                        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Rate Già Pagate</label><input type="number" id="p-pagate" value="0" class="w-full border rounded-lg p-2 text-sm outline-none"></div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 mt-2">Salva nel Cloud</button>
                </form>
            `);
        }
        window.salvaPrestito = async (e) => {
            e.preventDefault();
            await addDoc(refs.prestiti, {
                nome: document.getElementById('p-nome').value,
                tipo: document.getElementById('p-tipo').value,
                importoRata: document.getElementById('p-rata').value,
                numRate: document.getElementById('p-num').value,
                tasso: document.getElementById('p-tasso').value,
                ratePagate: document.getElementById('p-pagate').value || 0,
                ts: Date.now()
            });
            chiudiModale(); mostraNotifica("Finanziamento aggiunto!", "success");
        }
        
        window.aggiornaRatePrestito = async (id, nuoveRatePagate) => {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'users', currentUserId, 'prestiti', id), { ratePagate: nuoveRatePagate });
            mostraNotifica("Rata scalata con successo!", "success");
        }

        // Funzione Globale Eliminazione Sicura
        window.eliminaDoc = async (collezione, id) => {
            if(!confirm("Sicuro di voler eliminare questo elemento definitivamente?")) return;
            let refStr = '';
            if(collezione === 'casa') refStr = 'scadenze_casa';
            if(collezione === 'veicoli') refStr = 'veicoli';
            if(collezione === 'prestiti') refStr = 'prestiti';
            
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', currentUserId, refStr, id));
                mostraNotifica("Eliminato con successo", "success");
            } catch(e) { mostraNotifica("Errore durante l'eliminazione", "error"); }
        }

        // --- AVVIA L'APP AL CARICAMENTO ---
        avviaApp();

    </script>
</body>
</html>
