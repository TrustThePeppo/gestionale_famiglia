<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Familiare</title>
    <!-- 
    =============================================================================
    AGGIORNAMENTO CSS: RISOLUZIONE TRONCAMENTO TESTO SU MOBILE
    Inserisci o aggiorna queste regole nel tuo blocco <style> o file CSS.
    Queste regole forzano il testo lungo ad andare a capo nella lista della spesa.
    ============================================================================= 
    -->
    <style>
        /* Aggiungi queste proprietà alle classi che usi per i nomi degli articoli 
           nella dispensa alimentare e nella dispensa detersivi */
        
        .nome-articolo, 
        .testo-dispensa, 
        span.item-name,
        div.item-desc {
            white-space: normal !important; /* Disabilita il troncamento su una sola riga */
            word-wrap: break-word;          /* Permette di spezzare parole molto lunghe */
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.4;               /* Migliora la leggibilità su più righe */
        }

        /* Se il contenitore dell'articolo usa flexbox (display: flex),
           assicurati che il blocco di testo possa espandersi */
        .riga-articolo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .contenitore-testo-articolo {
            flex: 1; /* Prende tutto lo spazio disponibile senza spingere fuori i bottoni */
            padding-right: 10px; /* Spazio per non accavallarsi ai bottoni (es. elimina/modifica) */
        }
    </style>
</head>
<body>
    <!-- Questo è un file di esempio strutturale contenente il fix CSS.
         Dato che stiamo lavorando in remoto, applica le regole CSS qui sopra 
         all'interno del tuo attuale file index.html di produzione. -->
    
    <h1>Gestione Familiare - Test Layout</h1>
    
    <section>
        <h2>Dispensa</h2>
        <div class="riga-articolo">
            <!-- Applica le classi CSS qui per testare il comportamento -->
            <div class="contenitore-testo-articolo nome-articolo">
                Esempio di nome articolo lunghissimo: "Olio Extravergine d'Oliva Biologico Spremitura a Freddo 1L"
            </div>
            <button>+</button>
        </div>
    </section>

    <section>
        <h2>Detersivi</h2>
        <div class="riga-articolo">
            <div class="contenitore-testo-articolo nome-articolo">
                Esempio 2: "Detersivo Lavatrice Liquido Igienizzante Bicarbonato e Salvia 50 Lavaggi"
            </div>
            <button>+</button>
        </div>
    </section>

    <!-- Registrazione Service Worker invariata -->
    <script src="sv.js"></script>
</body>
</html>
